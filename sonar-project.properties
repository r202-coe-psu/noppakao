sonar.projectKey=noppakao
sonar.projectName=noppakao
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12, 3.13, 3.14

# Exclude third-party dependencies, virtual environments, compiled assets, cache, and reports
sonar.exclusions=\
  **/.venv/**,\
  **/venv/**,\
  **/node_modules/**,\
  **/reports/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.brython.js,\
  **/*.min.js,\
  **/*.min.css,\
  poetry.lock,\
  package-lock.json,\
  **/package-lock.json,\
  **/*.cfg,\
  **/*.cfg.simple,\
  **/.env*,\
  **/.pytest_cache/**,\
  **/htmlcov/**,\
  .coverage
